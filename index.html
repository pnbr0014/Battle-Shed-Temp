<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climate Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12161B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #12161B;
    --panel: #1A2027;
    --panel-line: #262E38;
    --warm: #E0954B;
    --cool: #4FA8C4;
    --text: #ECEEF1;
    --muted: #8993A4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 600;
    margin: 0;
  }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    display: inline-block;
    margin-right: 8px;
  }
  #status-dot.live { background: #6FCF8F; }
  .status-line { font-size: 13px; color: var(--muted); }

  .hero {
    display: flex;
    gap: 1px;
    background: var(--panel-line);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .hero-cell {
    flex: 1;
    background: var(--panel);
    padding: 20px 22px;
  }
  .hero-label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .hero-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 40px;
    font-weight: 700;
    line-height: 1;
  }
  .hero-value span.unit {
    font-size: 18px;
    color: var(--muted);
    font-weight: 500;
    margin-left: 4px;
  }
  .hero-cell:first-child .hero-value { color: var(--warm); }
  .hero-cell:last-child .hero-value { color: var(--cool); }

  .range-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  #range-select {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
  }
  input[type="date"] {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    display: none;
  }
  input[type="date"].shown { display: inline-block; }

  #interval-select {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    margin-left: auto;
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  .live-badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #6FCF8F;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    padding: 18px 20px 8px;
    margin-bottom: 18px;
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .panel-head h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }
  .panel-stats {
    font-size: 12px;
    color: var(--muted);
  }
  .reset-zoom {
    font-size: 12px;
    color: var(--cool);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    margin-left: 10px;
    display: none;
    font-family: 'Inter', sans-serif;
  }
  .reset-zoom.shown { display: inline; }
  .hint {
    font-size: 11px;
    color: var(--muted);
    margin: -4px 0 10px;
  }
  .chart-holder { height: 220px; }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Climate Log</h1>
    <div class="status-line"><span id="status-dot"></span><span id="status-text">Connecting&hellip;</span></div>
  </header>

  <div class="hero">
    <div class="hero-cell">
      <div class="hero-label">Temperature</div>
      <div class="hero-value"><span id="cur-temp">&ndash;</span><span class="unit">&deg;C</span></div>
    </div>
    <div class="hero-cell">
      <div class="hero-label">Humidity</div>
      <div class="hero-value"><span id="cur-humidity">&ndash;</span><span class="unit">%</span></div>
    </div>
  </div>
  <div class="live-badge" id="live-badge" style="display:none;">
    <span class="dot"></span> Live (updating every second)
  </div>

  <div class="range-row">
    <select id="range-select">
      <option value="1h">Last 1h</option>
      <option value="2h">Last 2h</option>
      <option value="4h">Last 4h</option>
      <option value="8h">Last 8h</option>
      <option value="12h">Last 12h</option>
      <option value="24h" selected>Last 24h</option>
      <option value="7d">Last 7d</option>
      <option value="30d">Last 30d</option>
      <option value="custom">Custom</option>
    </select>
    <input type="date" id="date-from">
    <input type="date" id="date-to">
    <select id="interval-select" title="How often the sensor logs to the graphs">
      <option value="30">Log every 30s</option>
      <option value="60">Log every 1 min</option>
      <option value="120" selected>Log every 2 min</option>
      <option value="300">Log every 5 min</option>
      <option value="600">Log every 10 min</option>
    </select>
  </div>
  <div class="hint">
    Click and drag on a graph to zoom into that time span (both graphs zoom together)
    <button class="reset-zoom" id="reset-zoom-btn">Reset zoom</button>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Temperature</h2>
      <div class="panel-stats" id="temp-stats"></div>
    </div>
    <div class="chart-holder"><canvas id="temp-chart"></canvas></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Humidity</h2>
      <div class="panel-stats" id="humidity-stats"></div>
    </div>
    <div class="chart-holder"><canvas id="humidity-chart"></canvas></div>
  </div>
</div>

<script>
// ---------- CONFIG: fill in your Supabase project details ----------
const SUPABASE_URL = "https://aytllpbggkvzdzyvuuqx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_-M3zdJGhZc_fFPSuiCDUyw_79mnuSo0";
const DEVICE_ID = "esp32-01";
// ---------------------------------------------------------------------

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const rangeSelect = document.getElementById('range-select');
const dateFrom = document.getElementById('date-from');
const dateTo = document.getElementById('date-to');
const resetZoomBtn = document.getElementById('reset-zoom-btn');

let activeRange = '24h';
let tempChart, humidityChart;
let syncingZoom = false;

const chartBaseOptions = (color, unit, getOtherChart) => ({
  type: 'line',
  data: { labels: [], datasets: [{
    data: [],
    borderColor: color,
    backgroundColor: color + '22',
    fill: true,
    tension: 0.3,
    pointRadius: 0,
    pointHoverRadius: 5,
    pointHoverBackgroundColor: color,
    pointHoverBorderColor: '#12161B',
    pointHoverBorderWidth: 2,
    borderWidth: 2,
  }]},
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: { duration: 300 },
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#1A2027',
        titleColor: '#8993A4',
        bodyColor: '#ECEEF1',
        bodyFont: { family: 'Space Grotesk', size: 14, weight: '600' },
        titleFont: { family: 'Inter', size: 12 },
        borderColor: '#262E38',
        borderWidth: 1,
        padding: 10,
        displayColors: false,
        callbacks: {
          label: (ctx) => `${ctx.parsed.y.toFixed(1)}${unit}`,
        },
      },
      zoom: {
        pan: { enabled: false },
        zoom: {
          drag: { enabled: true, backgroundColor: color + '33', borderColor: color, borderWidth: 1 },
          mode: 'x',
          onZoomComplete: ({ chart }) => {
            if (syncingZoom) return;
            syncingZoom = true;
            const other = getOtherChart();
            other.options.scales.x.min = chart.scales.x.min;
            other.options.scales.x.max = chart.scales.x.max;
            other.update('none');
            syncingZoom = false;
            resetZoomBtn.classList.add('shown');
          },
        },
      },
    },
    scales: {
      x: { ticks: { color: '#8993A4', maxTicksLimit: 6 }, grid: { color: '#262E38' } },
      y: { ticks: { color: '#8993A4' }, grid: { color: '#262E38' } },
    },
  },
});

function initCharts() {
  tempChart = new Chart(document.getElementById('temp-chart'), chartBaseOptions('#E0954B', '°C', () => humidityChart));
  humidityChart = new Chart(document.getElementById('humidity-chart'), chartBaseOptions('#4FA8C4', '%', () => tempChart));

  resetZoomBtn.addEventListener('click', () => {
    tempChart.resetZoom();
    humidityChart.resetZoom();
    resetZoomBtn.classList.remove('shown');
  });
}

const RANGE_HOURS = { '1h': 1, '2h': 2, '4h': 4, '8h': 8, '12h': 12, '24h': 24, '7d': 24 * 7, '30d': 24 * 30 };

function rangeToDates(range) {
  const now = new Date();
  const hours = RANGE_HOURS[range];
  const from = new Date(now - hours * 3600 * 1000);
  return { from, to: now };
}

function formatLabel(date, range) {
  const hours = RANGE_HOURS[range];
  if (hours && hours <= 24) return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return date.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' +
         date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function updateStats(elId, values, unit) {
  const el = document.getElementById(elId);
  if (!values.length) { el.textContent = ''; return; }
  const min = Math.min(...values).toFixed(1);
  const max = Math.max(...values).toFixed(1);
  const avg = (values.reduce((a, b) => a + b, 0) / values.length).toFixed(1);
  el.textContent = `min ${min}${unit} · avg ${avg}${unit} · max ${max}${unit}`;
}

async function loadReadings() {
  let from, to;
  if (activeRange === 'custom') {
    if (!dateFrom.value || !dateTo.value) return;
    from = new Date(dateFrom.value);
    to = new Date(dateTo.value + 'T23:59:59');
  } else {
    ({ from, to } = rangeToDates(activeRange));
  }

  const { data, error } = await sb
    .from('readings')
    .select('temperature_c, humidity_pct, recorded_at')
    .eq('device_id', DEVICE_ID)
    .gte('recorded_at', from.toISOString())
    .lte('recorded_at', to.toISOString())
    .order('recorded_at', { ascending: true });

  if (error) {
    statusDot.classList.remove('live');
    statusText.textContent = 'Connection error';
    console.error(error);
    return;
  }

  statusDot.classList.add('live');
  statusText.textContent = data.length ? 'Live' : 'No readings in range';

  const labels = data.map(r => formatLabel(new Date(r.recorded_at), activeRange));
  const temps = data.map(r => r.temperature_c);
  const humidities = data.map(r => r.humidity_pct);

  tempChart.data.labels = labels;
  tempChart.data.datasets[0].data = temps;
  tempChart.resetZoom();
  tempChart.update();

  humidityChart.data.labels = labels;
  humidityChart.data.datasets[0].data = humidities;
  humidityChart.resetZoom();
  humidityChart.update();

  resetZoomBtn.classList.remove('shown');

  updateStats('temp-stats', temps, '°C');
  updateStats('humidity-stats', humidities, '%');

  if (data.length) {
    const latest = data[data.length - 1];
    document.getElementById('cur-temp').textContent = latest.temperature_c.toFixed(1);
    document.getElementById('cur-humidity').textContent = latest.humidity_pct.toFixed(1);
  }
}

rangeSelect.addEventListener('change', () => {
  activeRange = rangeSelect.value;

  const showCustom = activeRange === 'custom';
  dateFrom.classList.toggle('shown', showCustom);
  dateTo.classList.toggle('shown', showCustom);

  if (!showCustom) loadReadings();
});

dateFrom.addEventListener('change', loadReadings);
dateTo.addEventListener('change', loadReadings);

// ---------- Live readings (instant, via Supabase Realtime broadcast) ----------
const liveBadge = document.getElementById('live-badge');
const liveChannel = sb.channel(`live-${DEVICE_ID}`);
liveChannel
  .on('broadcast', { event: 'reading' }, ({ payload }) => {
    document.getElementById('cur-temp').textContent = payload.temperature_c.toFixed(1);
    document.getElementById('cur-humidity').textContent = payload.humidity_pct.toFixed(1);
    liveBadge.style.display = 'inline-flex';
  })
  .subscribe();

// ---------- Graph logging interval (writes to device_settings for the ESP32 to pick up) ----------
const intervalSelect = document.getElementById('interval-select');

async function loadCurrentInterval() {
  const { data } = await sb
    .from('device_settings')
    .select('log_interval_seconds')
    .eq('device_id', DEVICE_ID)
    .maybeSingle();
  if (data) intervalSelect.value = String(data.log_interval_seconds);
}

intervalSelect.addEventListener('change', async () => {
  const seconds = parseInt(intervalSelect.value, 10);
  await sb.from('device_settings').upsert({
    device_id: DEVICE_ID,
    log_interval_seconds: seconds,
    updated_at: new Date().toISOString(),
  });
});

loadCurrentInterval();

initCharts();
loadReadings();
setInterval(loadReadings, 60000); // refresh graphs every minute

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(() => {});
}
</script>
</body>
</html>
